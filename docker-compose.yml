services:
  db:
    image: postgres:16-alpine
    container_name: brandos_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Published to host only for local debugging (psql/GUI clients).
      # Safe to remove once the app container talks to `db` internally.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    build: ./scheduler
    container_name: brandos_scheduler
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - scheduler_logs:/var/log/brandos

volumes:
  pgdata:
  scheduler_logs:
